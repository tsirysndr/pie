[package]
name = "pie-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"  # std::path::absolute
description = "Build official language runtimes and databases from source as position independent executables, from typed Pkl recipes"
license = "MIT"

# The package is `pie-cli`, but the library and the binary it ships are both
# plain `pie`: `use pie::…` in the tests, and `pie` on your PATH.
[lib]
name = "pie"
path = "src/lib.rs"

[[bin]]
name = "pie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
console = "0.15"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
